<!doctype html><html><body style="font-family:Arial;text-align:center;padding:40px"><h1>Beer Audio Test</h1><p>Put Beer.mp3 in the same folder as this file.</p><button id="play" style="font-size:20px;padding:15px 25px">Play Beer.mp3</button><p id="status"></p><audio id="audio" src="./Beer.mp3" preload="auto"></audio><script>const a=document.getElementById('audio'),s=document.getElementById('status');document.getElementById('play').onclick=()=>{a.currentTime=0;a.play().then(()=>s.textContent='Playing').catch(e=>s.textContent='Audio error: '+e.message)};a.onerror=()=>s.textContent='Could not load Beer.mp3. Check the filename and that the file is in the repository root.';</script></body></html>
