<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beer Calculator</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b0f;color:#fff;font-family:Arial}.calculator{width:min(360px,92vw);padding:20px;background:#17171d;border:1px solid #2b2b35;border-radius:24px;position:relative;overflow:hidden}.display{width:100%;height:80px;margin-bottom:12px;border:0;border-radius:14px;background:#0c0c10;color:#fff;font-size:34px;text-align:right;padding:12px}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}button{height:60px;border:0;border-radius:14px;background:#292931;color:#fff;font-size:20px}button:active{transform:scale(.96)}.op{background:#3a3a45}.eq{background:#2563eb}.clear{background:#b91c1c}.hint{text-align:center;color:#777;font-size:11px;margin-top:10px}.lyrics{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:rgba(12,12,16,.97);text-align:center;font-size:19px;line-height:1.5;opacity:0;visibility:hidden;transition:opacity 1.5s}.lyrics.show{opacity:1;visibility:visible}.lyricsText{white-space:pre-line;max-width:300px}</style></head><body><main class="calculator"><input id="display" class="display" readonly><div class="buttons"><button class="clear" onclick="clearDisplay()">C</button><button onclick="del()">DEL</button><button onclick="add('(')">(</button><button class="op" onclick="add('/')">÷</button><button onclick="add('7')">7</button><button onclick="add('8')">8</button><button onclick="add('9')">9</button><button class="op" onclick="add('*')">×</button><button onclick="add('4')">4</button><button onclick="add('5')">5</button><button onclick="add('6')">6</button><button class="op" onclick="add('-')">−</button><button onclick="add('1')">1</button><button onclick="add('2')">2</button><button onclick="add('3')">3</button><button class="op" onclick="add('+')">+</button><button onclick="add('0')">0</button><button onclick="add('.')">.</button><button class="eq" onclick="calculate()">=</button><button onclick="add(')')">)</button></div><div class="hint">Try 1 + 1</div><div id="lyrics" class="lyrics"><div id="lyricsText" class="lyricsText"></div></div></main><audio id="music" src="Beer.mp3" preload="auto"></audio><script>const d=document.getElementById('display'),m=document.getElementById('music'),l=document.getElementById('lyrics'),t=document.getElementById('lyricsText');let lyricData='';fetch('lyrics.txt').then(r=>r.text()).then(x=>lyricData=x);function add(v){d.value+=v}function clearDisplay(){d.value=''}function del(){d.value=d.value.slice(0,-1)}function calculate(){const e=d.value.replace(/\s/g,'');if(!e)return;if(e==='1+1'){d.value='2';m.currentTime=0;m.play().catch(()=>{});return}try{if(!/^[0-9+\-*/().]+$/.test(e))throw 0;d.value=Function('"use strict";return('+e+')')()}catch{d.value='Error'}}m.addEventListener('timeupdate',()=>{if(m.currentTime>=15&&m.currentTime<60){t.textContent=lyricData;l.classList.add('show')}else if(m.currentTime>=60){l.classList.remove('show')}});document.addEventListener('keydown',e=>{if(/[0-9+\-*/().]/.test(e.key))add(e.key);if(e.key==='Enter')calculate();if(e.key==='Backspace')del();if(e.key==='Escape')clearDisplay()});</script></body></html>
