<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#111"><title>Easter Egg Calculator</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:16px}.calculator{width:min(420px,100%);padding:18px;background:#202124;border:1px solid #333;border-radius:24px;box-shadow:0 20px 60px #0008;transition:opacity .7s,transform .7s,filter .7s}.calculator.hide{opacity:0;transform:scale(.94);filter:blur(8px);pointer-events:none}.display{width:100%;height:86px;background:#0b0b0d;border:1px solid #333;border-radius:15px;color:#fff;font-size:clamp(28px,8vw,42px);text-align:right;padding:12px 15px;margin-bottom:12px;outline:0}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}button{min-height:58px;border:0;border-radius:14px;background:#3a3a3d;color:#fff;font-size:19px;font-weight:600;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .08s,filter .15s}button:active{transform:scale(.94);filter:brightness(1.2)}.operator{background:#505055}.equals{background:#1677ff}.clear{background:#c62828}.scientific{display:none;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:9px}.scientific.open{display:grid}.scientific button{min-height:48px;font-size:15px}.toggle{width:100%;margin-top:10px;min-height:44px;background:#292a2d;font-size:14px}.status{min-height:18px;text-align:center;color:#888;font-size:12px;margin-top:8px}.video-screen{position:fixed;inset:0;background:#000;display:grid;place-items:center;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .7s}.video-screen.show{opacity:1;visibility:visible}.video-screen video{width:100%;height:100%;object-fit:contain}.dev{position:fixed;inset:0;background:#090909ee;display:none;z-index:10;padding:18px;overflow:auto}.dev.open{display:block}.panel{max-width:700px;margin:auto;background:#1b1b1d;border:1px solid #444;border-radius:18px;padding:18px}.panel h2{margin-top:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#111;border-radius:12px;padding:12px;text-align:center}.history{margin:14px 0;max-height:260px;overflow:auto;background:#111;border-radius:12px;padding:10px;font:13px ui-monospace,monospace}.row{padding:7px;border-bottom:1px solid #222}.dev-actions{display:flex;gap:8px;flex-wrap:wrap}.dev button{min-height:44px}.close{background:#555}.hint{color:#999;font-size:12px;line-height:1.5}</style></head><body><div id="calculator" class="calculator"><input id="display" class="display" value="0" readonly aria-label="Calculator display"><div class="buttons"><button class="clear" onclick="press('C')">C</button><button onclick="press('DEL')">DEL</button><button onclick="press('(')">(</button><button class="operator" onclick="press('/')">÷</button><button onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button><button class="operator" onclick="press('*')">×</button><button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button><button class="operator" onclick="press('-')">−</button><button onclick="press('1')">1</button><button onclick="press('2')">2</button><button onclick="press('3')">3</button><button class="operator" onclick="press('+')">+</button><button onclick="press('0')">0</button><button onclick="press('.')">.</button><button class="equals" onclick="press('=')">=</button><button onclick="press(')')">)</button></div><div id="scientific" class="scientific"><button onclick="scientific('sqrt')">√</button><button onclick="scientific('square')">x²</button><button onclick="scientific('sin')">sin</button><button onclick="scientific('cos')">cos</button><button onclick="scientific('tan')">tan</button><button onclick="scientific('log')">log</button><button onclick="scientific('ln')">ln</button><button onclick="scientific('fact')">n!</button><button onclick="scientific('percent')">%</button><button onclick="scientific('inverse')">1/x</button><button onclick="scientific('negate')">±</button><button onclick="press('π')">π</button><button onclick="press('e')">e</button><button onclick="scientific('clear')">AC</button></div><button class="toggle" onclick="toggleScientific()">Scientific Mode</button><div id="status" class="status"></div></div><div id="videoScreen" class="video-screen"><video id="video" playsinline preload="auto"></video></div><audio id="audio" preload="auto"></audio><div id="dev" class="dev"><div class="panel"><h2>Developer Mode</h2><div class="stats"><div class="stat"><b id="triggerCount">0</b><br>Triggers</div><div class="stat"><b id="historyCount">0</b><br>Runs</div><div class="stat"><b id="mediaCount">0</b><br>Media</div></div><div id="history" class="history">No triggers yet.</div><div class="dev-actions"><button onclick="testTrigger('1+1')">Test Beer</button><button onclick="testTrigger('2+2')">Test JV</button><button onclick="testTrigger('123')">Test 123</button><button class="close" onclick="toggleDev(false)">Close</button></div><p class="hint">Developer mode: Ctrl+Shift+D on desktop, or enter 1337 and press =.</p></div></div><script src="./triggers.js"></script><script>
'use strict';let expression='',activeTrigger=null,scientificMode=false,devMode=false,history=[];const display=document.getElementById('display'),calculator=document.getElementById('calculator'),videoScreen=document.getElementById('videoScreen'),video=document.getElementById('video'),audio=document.getElementById('audio');const triggerMap=window.TRIGGERS||{},resultMap=window.RESULT_TRIGGERS||{};function render(){display.value=expression||'0'}function haptic(){if(navigator.vibrate)navigator.vibrate(8)}function press(k){haptic();if(k==='C'){stopMedia();expression='';render();return}if(k==='DEL'){expression=expression.slice(0,-1);render();return}if(k==='='){solve();return}expression+=k;render();checkExact(expression)}function checkExact(v){if(triggerMap[v]&&!triggerMap[v].resultOnly)playTrigger(triggerMap[v],v)}function solve(){try{const s=expression.replace(/\s/g,'');if(!s||!/^[0-9+\-*/().]+$/.test(s))throw 0;const nums=[],ops=[];let i=0;function p(o){return o==='+'||o==='-'?1:2}function a(){const b=nums.pop(),x=nums.pop(),o=ops.pop();if(x===undefined||b===undefined)throw 0;if(o==='+')nums.push(x+b);else if(o==='-')nums.push(x-b);else if(o==='*')nums.push(x*b);else{if(b===0)throw 0;nums.push(x/b)}}while(i<s.length){const c=s[i];if(/[0-9.]/.test(c)){const st=i;while(i<s.length&&/[0-9.]/.test(s[i]))i++;const n=Number(s.slice(st,i));if(!Number.isFinite(n))throw 0;nums.push(n);continue}if(c==='('){ops.push(c);i++;continue}if(c===')'){while(ops.length&&ops[ops.length-1]!=='(')a();if(ops.pop()!=='(')throw 0;i++;continue}if('+-*/'.includes(c)){if(c==='-'&&(i===0||'(+\-*/'.includes(s[i-1])))nums.push(0);while(ops.length&&ops[ops.length-1]!=='('&&p(ops[ops.length-1])>=p(c))a();ops.push(c);i++;continue}throw 0}while(ops.length){if(ops[ops.length-1]==='(')throw 0;a()}if(nums.length!==1||!Number.isFinite(nums[0]))throw 0;const value=Number(nums[0].toFixed(12));expression=String(value);render();if(triggerMap[s])playTrigger(triggerMap[s],s);else if(resultMap[String(value)])playTrigger(resultMap[String(value)],'result '+value)}catch(e){expression='';display.value='Error'}}function scientific(op){haptic();try{const x=Number(expression||display.value),f={sqrt:()=>Math.sqrt(x),square:()=>x*x,sin:()=>Math.sin(x*Math.PI/180),cos:()=>Math.cos(x*Math.PI/180),tan:()=>Math.tan(x*Math.PI/180),log:()=>Math.log10(x),ln:()=>Math.log(x),percent:()=>x/100,inverse:()=>1/x,negate:()=>-x};let r;if(op==='fact'){if(x<0||x>170||x%1)throw 0;r=1;for(let i=2;i<=x;i++)r*=i}else if(op==='clear'){expression='';render();return}else r=f[op]();if(!Number.isFinite(r))throw 0;expression=String(Number(r.toFixed(12)));render()}catch(e){expression='';display.value='Error'}}function toggleScientific(){scientificMode=!scientificMode;document.getElementById('scientific').classList.toggle('open',scientificMode)}function playTrigger(t,key){if(!t||!t.video)return;stopMedia();activeTrigger=t;history.unshift({key,label:t.label||key,time:new Date().toLocaleTimeString()});history=history.slice(0,50);renderHistory();video.src='./'+t.video;video.muted=!!t.muted;video.currentTime=0;calculator.classList.add('hide');if(t.audio){audio.src='./'+t.audio;audio.currentTime=0;audio.load();const ap=audio.play();if(ap&&ap.catch)ap.catch(()=>{})}else{audio.pause();audio.removeAttribute('src');audio.load()}setTimeout(()=>{if(activeTrigger!==t)return;videoScreen.classList.add('show');video.currentTime=0;const vp=video.play();if(vp&&vp.catch)vp.catch(()=>{})},700)}function stopMedia(){activeTrigger=null;audio.pause();video.pause();audio.currentTime=0;video.currentTime=0;videoScreen.classList.remove('show')}function finishMedia(){stopMedia();setTimeout(()=>calculator.classList.remove('hide'),700)}audio.addEventListener('timeupdate',()=>{if(activeTrigger&&activeTrigger.sync&&!audio.paused&&!video.paused){const d=video.currentTime-audio.currentTime;if(Math.abs(d)>.25)video.currentTime=audio.currentTime}});video.addEventListener('ended',finishMedia);audio.addEventListener('ended',()=>{if(activeTrigger&&activeTrigger.sync)finishMedia()});function renderHistory(){document.getElementById('historyCount').textContent=history.length;document.getElementById('history').innerHTML=history.length?history.map(x=>'<div class="row">✓ '+escapeHtml(x.key)+' → '+escapeHtml(x.label)+' <span style="float:right">'+x.time+'</span></div>').join(''):'No triggers yet.'}function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toggleDev(open){devMode=open;document.getElementById('dev').classList.toggle('open',open);if(open){document.getElementById('triggerCount').textContent=Object.keys(triggerMap).length;document.getElementById('mediaCount').textContent=new Set(Object.values(triggerMap).map(t=>t.video).filter(Boolean)).size+Object.values(triggerMap).filter(t=>t.audio).length;renderHistory()}}function testTrigger(k){if(triggerMap[k])playTrigger(triggerMap[k],k)}document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='d'){toggleDev(!devMode);return}if(/^[0-9]$/.test(e.key)||['+','-','*','/','(',')','.'].includes(e.key))press(e.key);else if(e.key==='Enter'||e.key==='=')press('=');else if(e.key==='Backspace')press('DEL');else if(e.key==='Escape')press('C')});render();renderHistory();
</script></body></html>
