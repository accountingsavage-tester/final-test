<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Calculator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;display:grid;place-items:center;background:#0b0b0f;color:#fff;font-family:Inter,Arial,sans-serif;overflow:hidden}.calculator{width:min(360px,92vw);padding:20px;border:1px solid #2b2b35;border-radius:24px;background:#17171d;box-shadow:0 25px 70px #0008;position:relative;overflow:hidden}.display{width:100%;height:88px;border:0;border-radius:16px;background:#0c0c10;color:#fff;padding:16px;text-align:right;font-size:36px;outline:0;margin-bottom:14px}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}button{height:62px;border:0;border-radius:15px;background:#292931;color:#fff;font-size:20px;cursor:pointer;transition:.12s}button:hover{filter:brightness(1.18)}button:active{transform:scale(.95)}.op{background:#3a3a45}.eq{background:#2563eb}.clear{background:#b91c1c}.lyrics{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;background:rgba(12,12,16,.96);font-size:24px;line-height:1.45;opacity:0;pointer-events:none;transform:translateY(18px);transition:opacity 1.2s ease,transform 1.2s ease;z-index:5}.lyrics.show{opacity:1;transform:translateY(0)}.lyrics.hide{opacity:0;transform:translateY(-18px)}.hint{font-size:11px;color:#777;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="calculator">
<input id="display" class="display" readonly aria-label="Calculator display">
<div class="buttons">
<button class="clear" onclick="clearDisplay()">C</button><button onclick="del()">DEL</button><button onclick="add('(')">(</button><button class="op" onclick="add('/')">÷</button>
<button onclick="add('7')">7</button><button onclick="add('8')">8</button><button onclick="add('9')">9</button><button class="op" onclick="add('*')">×</button>
<button onclick="add('4')">4</button><button onclick="add('5')">5</button><button onclick="add('6')">6</button><button class="op" onclick="add('-')">−</button>
<button onclick="add('1')">1</button><button onclick="add('2')">2</button><button onclick="add('3')">3</button><button class="op" onclick="add('+')">+</button>
<button onclick="add('0')">0</button><button onclick="add('.')">.</button><button class="eq" onclick="calculate()">=</button><button onclick="add(')')">)</button>
</div>
<div class="hint">Try 1 + 1</div>
<div id="lyrics" class="lyrics"></div>
</div>
<audio id="music" src="music.mp3" preload="auto"></audio>
<script>
const display=document.getElementById('display'),music=document.getElementById('music'),lyrics=document.getElementById('lyrics');
function add(v){display.value+=v}function clearDisplay(){display.value=''}function del(){display.value=display.value.slice(0,-1)}
function calculate(){const expression=display.value.replace(/\s/g,'');if(!expression)return;if(expression==='1+1'){display.value='2';triggerMusic();return}try{if(!/^[0-9+\-*/().\s]+$/.test(expression))throw Error();display.value=Function('"use strict";return ('+expression+')')()}catch{display.value='Error'}}
function triggerMusic(){music.currentTime=0;music.play().catch(()=>{});lyrics.classList.remove('hide');lyrics.classList.add('show');setTimeout(()=>music.currentTime=15,50);setTimeout(()=>{lyrics.classList.add('hide');lyrics.classList.remove('show')},45000)}
music.addEventListener('timeupdate',()=>{if(music.currentTime>=60){lyrics.classList.add('hide');lyrics.classList.remove('show')}});
document.addEventListener('keydown',e=>{if(/[0-9+\-*/().]/.test(e.key))add(e.key);if(e.key==='Enter')calculate();if(e.key==='Backspace')del();if(e.key==='Escape')clearDisplay()});
</script>
</body>
</html>
