<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Calculator</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#fff;font-family:Arial,sans-serif}.calculator{width:min(360px,92vw);padding:20px;background:#222;border-radius:20px}.display{width:100%;height:80px;background:#0b0b0d;border:0;border-radius:12px;color:#fff;font-size:34px;text-align:right;padding:12px;margin-bottom:12px}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}button{height:62px;border:0;border-radius:13px;background:#444;color:#fff;font-size:20px;cursor:pointer;touch-action:manipulation}.operator{background:#555}.equals{background:#1677ff}.clear{background:#c22}</style></head><body><div class="calculator"><input id="display" class="display" value="0" readonly><div class="buttons"><button class="clear" onclick="press('C')">C</button><button onclick="press('DEL')">DEL</button><button onclick="press('(')">(</button><button class="operator" onclick="press('/')">÷</button><button onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button><button class="operator" onclick="press('*')">×</button><button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button><button class="operator" onclick="press('-')">−</button><button onclick="press('1')">1</button><button onclick="press('2')">2</button><button onclick="press('3')">3</button><button class="operator" onclick="press('+')">+</button><button onclick="press('0')">0</button><button onclick="press('.')">.</button><button class="equals" onclick="press('=')">=</button><button onclick="press(')')">)</button></div></div><script>var expression='',display=document.getElementById('display');function render(){display.value=expression||'0'}function press(k){if(k==='C'){expression='';return render()}if(k==='DEL'){expression=expression.slice(0,-1);return render()}if(k==='='){return solve()}expression+=k;render()}function solve(){if(!expression)return;try{var answer=Function('return '+expression)();if(typeof answer!=='number'||!isFinite(answer))throw new Error('bad');expression=String(answer);render()}catch(e){expression='';display.value='Error'}}document.addEventListener('keydown',function(e){if(/^[0-9]$/.test(e.key)||['+','-','*','/','(',')','.'].includes(e.key))press(e.key);else if(e.key==='Enter'||e.key==='=')press('=');else if(e.key==='Backspace')press('DEL');else if(e.key==='Escape')press('C')});</script></body></html>
