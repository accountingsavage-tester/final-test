<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><title>Easter Egg Calculator</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#09090b;color:#f5f5f5;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:12px}.app{width:min(430px,100%)}.calculator{padding:15px;background:#1b1c1f;border:1px solid #34363b;border-radius:25px;box-shadow:0 22px 70px #0009;transition:.5s}.calculator.hide{opacity:0;transform:scale(.96);filter:blur(9px);pointer-events:none}.display{display:block;width:100%;height:96px;border:1px solid #34363b;border-radius:17px;background:#08090b;color:#fff;padding:14px;text-align:right;font:500 clamp(30px,8vw,45px)/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;outline:0}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:11px}button{min-height:58px;border:0;border-radius:14px;background:#383a3f;color:#fff;font-size:18px;font-weight:650;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent}button:active{transform:scale(.94);filter:brightness(1.18)}button:focus-visible{outline:2px solid #78a9ff;outline-offset:2px}.op{background:#4b4d53}.eq{background:#1769ff}.danger{background:#b72c2c}.scientific{display:none;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:8px}.scientific.open{display:grid}.scientific button{min-height:45px;font-size:13px}.toolbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px}.tool{min-height:43px;background:#292b30;font-size:12px}.status{text-align:center;height:17px;margin-top:6px;color:#898b91;font-size:11px}.media{position:fixed;inset:0;z-index:20;background:#000;display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .5s}.media.show{opacity:1;visibility:visible}.media video{width:100%;height:100%;object-fit:contain}.media-controls{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px}.media-controls button{min-height:42px;padding:0 14px;background:#fff2;backdrop-filter:blur(12px);font-size:13px}.dev{position:fixed;inset:0;z-index:50;display:none;background:#08090bf5;padding:14px;overflow:auto}.dev.open{display:block}.panel{max-width:760px;margin:auto;background:#1a1b1f;border:1px solid #3a3b41;border-radius:20px;padding:17px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.stat{background:#0d0e10;border-radius:12px;padding:10px;text-align:center;font-size:11px}.stat b{font-size:20px}.history{max-height:260px;overflow:auto;background:#0d0e10;border-radius:12px;padding:7px;font:12px ui-monospace,monospace}.row{padding:8px;border-bottom:1px solid #202125}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.actions button{min-height:43px;padding:0 12px}.hint{color:#92949a;font-size:11px;line-height:1.5}@media(max-width:380px){body{padding:8px}.calculator{padding:10px}.buttons{gap:6px}button{min-height:54px}.display{height:88px}}
</style></head><body><main class="app"><section id="calculator" class="calculator"><input id="display" class="display" value="0" readonly aria-label="Calculator display"><div class="buttons"><button class="danger" data-key="C">C</button><button data-key="DEL">DEL</button><button data-key="(">(</button><button class="op" data-key="/">÷</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button class="op" data-key="*">×</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button class="op" data-key="-">−</button><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button class="op" data-key="+">+</button><button data-key="0">0</button><button data-key=".">.</button><button class="eq" data-key="=">=</button><button data-key=")">)</button></div><div id="scientific" class="scientific"><button data-sci="sqrt">√</button><button data-sci="square">x²</button><button data-sci="power">xʸ</button><button data-sci="sin">sin</button><button data-sci="cos">cos</button><button data-sci="tan">tan</button><button data-sci="log">log</button><button data-sci="ln">ln</button><button data-sci="fact">n!</button><button data-sci="percent">%</button><button data-sci="inverse">1/x</button><button data-sci="negate">±</button><button data-key="pi">π</button><button data-key="e">e</button><button data-sci="clear">AC</button></div><div class="toolbar"><button class="tool" id="sciBtn">Scientific</button><button class="tool" id="memoryBtn">M+</button><button class="tool" id="historyBtn">History</button></div><div id="status" class="status"></div></section></main><div id="media" class="media"><video id="video" playsinline preload="auto"></video><div class="media-controls"><button id="closeBtn">Close</button><button id="fullBtn">Fullscreen</button></div></div><audio id="audio" preload="auto"></audio><div id="dev" class="dev"><div class="panel"><h2>Developer Mode</h2><div class="stats"><div class="stat"><b id="triggerCount">0</b><br>Triggers</div><div class="stat"><b id="runCount">0</b><br>Runs</div><div class="stat"><b id="mediaCount">0</b><br>Media</div></div><div id="history" class="history">No trigger runs yet.</div><div class="actions"><button data-test="1+1">Test Beer</button><button data-test="2+2">Test JV</button><button data-test="123">Test 123</button><button data-test="69">Test 69</button><button id="closeDev">Close</button></div><p class="hint">Ctrl+Shift+D opens developer mode on desktop. On mobile, enter 1337 and press =.</p></div></div><script src="./triggers.js"></script><script>
'use strict';
const $=id=>document.getElementById(id);const display=$('display'),calculator=$('calculator'),media=$('media'),video=$('video'),audio=$('audio'),status=$('status'),dev=$('dev'),sci=$('scientific');const exact=window.TRIGGERS||{},resultTriggers=window.RESULT_TRIGGERS||{};let expr='',answer=null,memory=0,active=null,history=JSON.parse(localStorage.getItem('eggHistory')||'[]');
function render(){display.value=expr||'0'}function buzz(){navigator.vibrate?.(7)}function msg(t){status.textContent=t;clearTimeout(msg.t);msg.t=setTimeout(()=>status.textContent='',2000)}
function press(k){buzz();if(k==='C'){stopMedia();expr='';answer=null;render();return}if(k==='DEL'){expr=expr.slice(0,-1);render();return}if(k==='='){calculate();return}expr+=k==='pi'?'pi':k;render();if(exact[expr])play(exact[expr],expr)}
function lex(s){const a=[];let i=0;while(i<s.length){const c=s[i];if(/\s/.test(c)){i++;continue}if(/[0-9.]/.test(c)){let st=i,d=0;while(i<s.length&&/[0-9.]/.test(s[i])){if(s[i]==='.')d++;i++}if(d>1)throw 0;a.push({t:'n',v:Number(s.slice(st,i))});continue}if(s.startsWith('pi',i)){a.push({t:'n',v:Math.PI});i+=2;continue}if(c==='e'){a.push({t:'n',v:Math.E});i++;continue}if('+-*/^()'.includes(c)){a.push({t:c});i++;continue}throw 0}return a}
function evalExpr(s){const t=lex(s);let i=0;function primary(){const x=t[i++];if(!x)throw 0;if(x.t==='n')return x.v;if(x.t==='+')return primary();if(x.t==='-')return -primary();if(x.t==='('){const v=add();if(!t[i]||t[i++].t!==')')throw 0;return v}throw 0}function power(){let v=primary();if(t[i]?.t==='^'){i++;v=Math.pow(v,power())}return v}function mul(){let v=power();while(t[i]&&'*/'.includes(t[i].t)){const o=t[i++].t,b=power();if(o==='/'&&b===0)throw 0;v=o==='*'?v*b:v/b}return v}function add(){let v=mul();while(t[i]&&'+-'.includes(t[i].t)){const o=t[i++].t,b=mul();v=o==='+'?v+b:v-b}return v}const v=add();if(i!==t.length||!Number.isFinite(v))throw 0;return v}
function calculate(){try{const raw=expr.replace(/\s/g,'');if(!raw)throw 0;const v=evalExpr(raw);answer=v;expr=String(Number(v.toFixed(12)));render();if(raw==='1337'){openDev();return}if(exact[raw])play(exact[raw],raw);else if(resultTriggers[String(Number(v))])play(resultTriggers[String(Number(v))],'result '+v)}catch(e){expr='';display.value='Error';msg('Invalid calculation')}}
function scientific(op){buzz();try{const x=Number(answer??expr);if(!Number.isFinite(x))throw 0;let r;if(op==='sqrt')r=Math.sqrt(x);else if(op==='square')r=x*x;else if(op==='power'){expr=String(x)+'^';render();return}else if(op==='sin')r=Math.sin(x*Math.PI/180);else if(op==='cos')r=Math.cos(x*Math.PI/180);else if(op==='tan')r=Math.tan(x*Math.PI/180);else if(op==='log')r=Math.log10(x);else if(op==='ln')r=Math.log(x);else if(op==='percent')r=x/100;else if(op==='inverse'){if(x===0)throw 0;r=1/x}else if(op==='negate')r=-x;else if(op==='fact'){if(x<0||x>170||x%1)throw 0;r=1;for(let j=2;j<=x;j++)r*=j}else if(op==='clear'){expr='';answer=null;render();return}if(!Number.isFinite(r))throw 0;answer=r;expr=String(Number(r.toFixed(12)));render()}catch(e){expr='';display.value='Error';msg('Invalid operation')}}
function play(t,key){if(!t?.video)return;stopMedia();active=t;record(key,t.label||key);calculator.classList.add('hide');video.src='./'+t.video;video.muted=!!t.muted;video.currentTime=0;if(t.audio){audio.src='./'+t.audio;audio.load();audio.currentTime=0;audio.play().catch(()=>msg('Audio blocked by browser'))}else{audio.pause();audio.removeAttribute('src');audio.load()}setTimeout(()=>{if(active!==t)return;media.classList.add('show');video.play().catch(()=>msg('Tap video to play'))},520)}function stopMedia(){active=null;video.pause();audio.pause();video.currentTime=0;audio.currentTime=0;media.classList.remove('show')}function finish(){stopMedia();setTimeout(()=>calculator.classList.remove('hide'),520)}audio.addEventListener('timeupdate',()=>{if(active?.sync&&!audio.paused&&!video.paused){const d=video.currentTime-audio.currentTime;if(Math.abs(d)>.2)video.currentTime=audio.currentTime}});video.addEventListener('ended',finish);audio.addEventListener('ended',()=>{if(active?.sync)finish()});$('closeBtn').onclick=finish;$('fullBtn').onclick=()=>video.requestFullscreen?.().catch(()=>{});
function record(key,label){history.unshift({key,label,time:new Date().toLocaleString()});history=history.slice(0,50);localStorage.setItem('eggHistory',JSON.stringify(history));renderHistory()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderHistory(){$('runCount').textContent=history.length;$('history').innerHTML=history.length?history.map(x=>'<div class="row">✓ '+esc(x.key)+' → '+esc(x.label)+' <span style="float:right">'+esc(x.time)+'</span></div>').join(''):'No trigger runs yet.'}function openDev(){dev.classList.add('open');$('triggerCount').textContent=Object.keys(exact).length+Object.keys(resultTriggers).length;$('mediaCount').textContent=new Set([...Object.values(exact),...Object.values(resultTriggers)].map(x=>x.video).filter(Boolean)).size;renderHistory()}function test(k){if(exact[k])play(exact[k],k);else if(resultTriggers[k])play(resultTriggers[k],'result '+k)}
$('sciBtn').onclick=()=>{sci.classList.toggle('open');$('sciBtn').textContent=sci.classList.contains('open')?'Basic':'Scientific'};$('memoryBtn').onclick=()=>{memory=answer??Number(expr)||0;msg('Memory stored')};$('historyBtn').onclick=openDev;$('closeDev').onclick=()=>dev.classList.remove('open');document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>press(b.dataset.key));document.querySelectorAll('[data-sci]').forEach(b=>b.onclick=()=>scientific(b.dataset.sci));document.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>test(b.dataset.test));document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='d'){dev.classList.toggle('open');openDev();return}if(/^[0-9]$/.test(e.key)||['+','-','*','/','(',')','.'].includes(e.key))press(e.key);else if(e.key==='Enter'||e.key==='=')press('=');else if(e.key==='Backspace')press('DEL');else if(e.key==='Escape'){if(media.classList.contains('show'))finish();else if(dev.classList.contains('open'))dev.classList.remove('open');else press('C')}});render();renderHistory();
</script></body></html>
