<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Calculator</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#fff;font-family:Arial,sans-serif}.calculator{width:min(360px,92vw);padding:20px;background:#222;border-radius:20px}.display{width:100%;height:80px;background:#0b0b0d;border:0;border-radius:12px;color:#fff;font-size:34px;text-align:right;padding:12px;margin-bottom:12px}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}button{height:62px;border:0;border-radius:13px;background:#444;color:#fff;font-size:20px;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.96)}.operator{background:#555}.equals{background:#1677ff}.clear{background:#c22}</style></head><body><div class="calculator"><input id="display" class="display" value="0" readonly><div class="buttons"><button class="clear" data-action="clear">C</button><button data-action="delete">DEL</button><button data-value="(">(</button><button class="operator" data-value="/">÷</button><button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button><button class="operator" data-value="*">×</button><button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button class="operator" data-value="-">−</button><button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button class="operator" data-value="+">+</button><button data-value="0">0</button><button data-value=".">.</button><button class="equals" data-action="equals">=</button><button data-value=")">)</button></div></div><script>const display=document.getElementById('display');let expression='';function render(){display.value=expression||'0'}function add(v){expression+=v;render()}function clearCalc(){expression='';render()}function del(){expression=expression.slice(0,-1);render()}function calculate(){if(!expression)return;try{if(!/^[0-9+\-*/().\s]+$/.test(expression))throw Error();const answer=Function('"use strict";return ('+expression+')')();if(!Number.isFinite(answer))throw Error();expression=String(answer);render()}catch{display.value='Error';expression=''}}document.querySelectorAll('button').forEach(button=>{button.addEventListener('click',function(){if(this.dataset.value!==undefined)add(this.dataset.value);else if(this.dataset.action==='clear')clearCalc();else if(this.dataset.action==='delete')del();else if(this.dataset.action==='equals')calculate()})});document.addEventListener('keydown',function(e){if(/[0-9+\-*/().]/.test(e.key))add(e.key);else if(e.key==='Enter')calculate();else if(e.key==='Backspace')del();else if(e.key==='Escape')clearCalc()});</script></body></html>
