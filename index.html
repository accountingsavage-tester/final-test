<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beer Calculator</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#fff;font:20px Arial}.calc{width:320px;padding:18px;background:#222;border-radius:18px}.d{width:100%;height:70px;background:#111;color:#fff;border:0;font-size:30px;text-align:right}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}button{height:58px;background:#444;color:#fff;border:0;border-radius:10px;font-size:19px}.eq{background:#1677ff}.c{background:#c22}.lyrics{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:#111e;opacity:0;visibility:hidden;transition:opacity 1.5s}.on{opacity:1;visibility:visible}.txt{white-space:pre-line;line-height:1.6}</style><div class="calc"><input id="d" class="d" readonly><div class="g"><button class="c" onclick="C()">C</button><button onclick="B()">DEL</button><button onclick="A('(')">(</button><button onclick="A('/')">÷</button><button onclick="A('7')">7</button><button onclick="A('8')">8</button><button onclick="A('9')">9</button><button onclick="A('*')">×</button><button onclick="A('4')">4</button><button onclick="A('5')">5</button><button onclick="A('6')">6</button><button onclick="A('-')">−</button><button onclick="A('1')">1</button><button onclick="A('2')">2</button><button onclick="A('3')">3</button><button onclick="A('+')">+</button><button onclick="A('0')">0</button><button onclick="A('.')">.</button><button class="eq" onclick="E()">=</button><button onclick="A(')')">)</button></div></div><div id="l" class="lyrics"><div id="t" class="txt"></div></div><audio id="a" src="./Beer.mp3"></audio><script src="app.js"></script>
