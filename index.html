<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><title>Calculator</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#09090b;color:#f5f5f5;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:14px}.app{width:min(430px,100%)}.calculator{padding:16px;background:linear-gradient(145deg,#222327,#18191c);border:1px solid #34353a;border-radius:26px;box-shadow:0 24px 80px #0009;transition:opacity .55s,transform .55s,filter .55s}.calculator.hide{opacity:0;transform:scale(.96);filter:blur(10px);pointer-events:none}.display-wrap{position:relative}.display{width:100%;height:100px;border:1px solid #34353a;border-radius:18px;background:#08090b;color:#fff;padding:18px 16px;text-align:right;font:500 clamp(30px,8vw,46px)/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;outline:0;overflow:hidden;text-overflow:ellipsis}.memory{position:absolute;left:13px;top:10px;color:#777;font-size:11px}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}button{border:0;border-radius:15px;min-height:58px;background:#38393d;color:#fff;font-size:18px;font-weight:650;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .08s,filter .15s,background .15s}button:active{transform:scale(.94);filter:brightness(1.2)}button:focus-visible{outline:2px solid #78a9ff;outline-offset:2px}.op{background:#4b4c51}.eq{background:#1769ff}.danger{background:#b52b2b}.tool{background:#292a2e;font-size:13px;min-height:45px}.scientific{display:none;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:9px}.scientific.open{display:grid}.scientific button{min-height:46px;font-size:14px}.toolbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:9px}.status{height:18px;margin-top:6px;text-align:center;color:#85868b;font-size:11px}.video-screen{position:fixed;inset:0;background:#000;display:grid;place-items:center;opacity:0;visibility:hidden;z-index:20;transition:opacity .55s}.video-screen.show{opacity:1;visibility:visible}.video-screen video{width:100%;height:100%;object-fit:contain}.media-ui{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;opacity:0;transition:opacity .25s;z-index:21}.video-screen.show .media-ui{opacity:1}.media-ui button{min-height:42px;padding:0 15px;background:#ffffff22;backdrop-filter:blur(10px);font-size:13px}.dev{position:fixed;inset:0;z-index:50;display:none;background:#08090bf2;padding:16px;overflow:auto}.dev.open{display:block}.panel{max-width:760px;margin:0 auto;background:#1b1c20;border:1px solid #3a3b40;border-radius:20px;padding:18px}.panel h2{margin:0 0 12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0d0e10;border-radius:13px;padding:12px;text-align:center;font-size:12px}.stat b{font-size:20px}.history{max-height:280px;overflow:auto;background:#0d0e10;border-radius:13px;padding:8px;margin:12px 0;font:12px ui-monospace,monospace}.row{padding:8px;border-bottom:1px solid #202125}.dev-actions{display:flex;flex-wrap:wrap;gap:8px}.dev-actions button{min-height:44px;padding:0 13px}.hint{color:#929399;font-size:12px;line-height:1.5}@media(max-width:380px){body{padding:9px}.calculator{padding:11px}.buttons{gap:7px}button{min-height:54px}.display{height:88px}.scientific{gap:5px}.scientific button{font-size:12px}}
</style></head><body><main class="app"><section id="calculator" class="calculator"><div class="display-wrap"><span id="memory" class="memory"></span><input id="display" class="display" value="0" readonly aria-label="Calculator display"></div><div class="buttons"><button class="danger" data-k="C">C</button><button data-k="DEL">DEL</button><button data-k="(">(</button><button class="op" data-k="/">÷</button><button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="*">×</button><button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="-">−</button><button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="+">+</button><button data-k="0">0</button><button data-k=".">.</button><button class="eq" data-k="=">=</button><button data-k=")">)</button></div><div id="scientific" class="scientific"><button data-s="sqrt">√</button><button data-s="square">x²</button><button data-s="power">xʸ</button><button data-s="sin">sin</button><button data-s="cos">cos</button><button data-s="tan">tan</button><button data-s="log">log</button><button data-s="ln">ln</button><button data-s="fact">n!</button><button data-s="percent">%</button><button data-s="inverse">1/x</button><button data-s="negate">±</button><button data-k="π">π</button><button data-k="e">e</button><button data-s="clear">AC</button></div><div class="toolbar"><button class="tool" id="memoryBtn">M+</button><button class="tool" id="scientificBtn">Scientific</button><button class="tool" id="historyBtn">History</button></div><div id="status" class="status"></div></section></main><div id="videoScreen" class="video-screen"><video id="video" playsinline preload="auto"></video><div class="media-ui"><button id="closeMedia">Close</button><button id="fullscreenMedia">Fullscreen</button></div></div><audio id="audio" preload="auto"></audio><div id="dev" class="dev"><div class="panel"><h2>Developer Mode</h2><div class="stats"><div class="stat"><b id="triggerCount">0</b><br>Configured</div><div class="stat"><b id="historyCount">0</b><br>Runs</div><div class="stat"><b id="mediaCount">0</b><br>Media</div></div><div id="history" class="history">No trigger runs yet.</div><div class="dev-actions"><button data-test="1+1">Test Beer</button><button data-test="2+2">Test JV</button><button data-test="123">Test 123</button><button data-test="69">Test Result 69</button><button id="closeDev">Close</button></div><p class="hint">Desktop: Ctrl+Shift+D. Mobile: enter 1337 and press =. Trigger definitions live in triggers.js.</p></div></div><script src="./triggers.js"></script><script>
'use strict';
const $=id=>document.getElementById(id);const display=$('display'),calculator=$('calculator'),videoScreen=$('videoScreen'),video=$('video'),audio=$('audio'),status=$('status'),memoryLabel=$('memory'),scientificPanel=$('scientific'),dev=$('dev');const exact=window.TRIGGERS||{},results=window.RESULT_TRIGGERS||{};let expression='',memory=0,active=null,history=JSON.parse(localStorage.getItem('calcTriggerHistory')||'[]'),lastAnswer=null;
function render(){display.value=expression||'0';memoryLabel.textContent=memory?'M':''}function buzz(){if(navigator.vibrate)navigator.vibrate(7)}function say(t){status.textContent=t;clearTimeout(say.timer);say.timer=setTimeout(()=>status.textContent='',2200)}
function press(k){buzz();if(k==='C'){stopMedia();expression='';lastAnswer=null;render();return}if(k==='DEL'){expression=expression.slice(0,-1);render();return}if(k==='='){solve();return}if(k==='π')expression+='pi';else expression+=k;render();if(exact[expression])playTrigger(exact[expression],expression)}
function tokenize(s){const out=[];let i=0;while(i<s.length){if(/\s/.test(s[i])){i++;continue}if(/[0-9.]/.test(s[i])){let st=i,dots=0;while(i<s.length&&/[0-9.]/.test(s[i])){if(s[i]==='.')dots++;i++}if(dots>1)throw Error();out.push({t:'num',v:Number(s.slice(st,i))});continue}if(s.startsWith('pi',i)){out.push({t:'num',v:Math.PI});i+=2;continue}if(s[i]==='e'){out.push({t:'num',v:Math.E});i++;continue}if('+-*/^()'.includes(s[i])){out.push({t:s[i]});i++;continue}throw Error()}return out}
function evaluate(s){const ts=tokenize(s);let p=0;function parsePrimary(){const t=ts[p++];if(!t)throw Error();if(t.t==='num')return t.v;if(t.t==='-')return -parsePrimary();if(t.t==='+')return parsePrimary();if(t.t==='('){const v=parseAdd();if(!ts[p]||ts[p].t!==')')throw Error();p++;return v}throw Error()}function parsePower(){let a=parsePrimary();if(ts[p]&&ts[p].t==='^'){p++;a=Math.pow(a,parsePower())}return a}function parseMul(){let a=parsePower();while(ts[p]&&'*/'.includes(ts[p].t)){const o=ts[p++].t,b=parsePower();if(o==='/'&&b===0)throw Error();a=o==='*'?a*b:a/b}return a}function parseAdd(){let a=parseMul();while(ts[p]&&'+-'.includes(ts[p].t)){const o=ts[p++].t,b=parseMul();a=o==='+'?a+b:a-b}return a}const v=parseAdd();if(p!==ts.length||!Number.isFinite(v))throw Error();return v}
function solve(){try{const s=expression.replace(/\s/g,'');if(!s)throw Error();const value=evaluate(s);lastAnswer=value;expression=String(Number(value.toFixed(12)));render();if(s==='1337'){toggleDev(true);return}if(exact[s])playTrigger(exact[s],s);else if(results[String(Number(value))])playTrigger(results[String(Number(value))],'result '+value)}catch(e){expression='';display.value='Error';say('Invalid calculation')}}
function scientific(op){buzz();try{const x=Number(lastAnswer??expression);if(!Number.isFinite(x))throw Error();let r;if(op==='sqrt')r=Math.sqrt(x);if(op==='square')r=x*x;if(op==='sin')r=Math.sin(x*Math.PI/180);if(op==='cos')r=Math.cos(x*Math.PI/180);if(op==='tan')r=Math.tan(x*Math.PI/180);if(op==='log')r=Math.log10(x);if(op==='ln')r=Math.log(x);if(op==='percent')r=x/100;if(op==='inverse'){if(x===0)throw Error();r=1/x}if(op==='negate')r=-x;if(op==='fact'){if(x<0||x>170||x%1)throw Error();r=1;for(let i=2;i<=x;i++)r*=i}if(op==='power'){expression=String(x)+'^';render();return}if(op==='clear'){expression='';lastAnswer=null;render();return}if(!Number.isFinite(r))throw Error();lastAnswer=r;expression=String(Number(r.toFixed(12)));render()}catch(e){expression='';display.value='Error';say('Invalid scientific operation')}}
function toggleScientific(){scientificPanel.classList.toggle('open');$('scientificBtn').textContent=scientificPanel.classList.contains('open')?'Basic':'Scientific'}
function playTrigger(t,key){if(!t||!t.video)return;stopMedia();active=t;addHistory(key,t.label||key);video.src='./'+t.video;video.muted=!!t.muted;video.currentTime=0;calculator.classList.add('hide');if(t.audio){audio.src='./'+t.audio;audio.load();audio.currentTime=0;const p=audio.play();if(p)p.catch(()=>say('Tap to allow audio'))}else{audio.pause();audio.removeAttribute('src');audio.load()}setTimeout(()=>{if(active!==t)return;videoScreen.classList.add('show');const p=video.play();if(p)p.catch(()=>say('Tap the video to play'))},550)}
function stopMedia(){active=null;audio.pause();video.pause();audio.currentTime=0;video.currentTime=0;videoScreen.classList.remove('show')}function finish(){stopMedia();setTimeout(()=>calculator.classList.remove('hide'),550)}audio.addEventListener('timeupdate',()=>{if(active&&active.sync&&!audio.paused&&!video.paused){const d=video.currentTime-audio.currentTime;if(Math.abs(d)>.25)video.currentTime=audio.currentTime}});video.addEventListener('ended',finish);audio.addEventListener('ended',()=>{if(active&&active.sync)finish()});$('closeMedia').onclick=finish;$('fullscreenMedia').onclick=()=>{if(video.requestFullscreen)video.requestFullscreen().catch(()=>{})};
function addHistory(key,label){history.unshift({key,label,time:new Date().toLocaleString()});history=history.slice(0,50);localStorage.setItem('calcTriggerHistory',JSON.stringify(history));renderHistory()}
function renderHistory(){ $('historyCount').textContent=history.length;$('history').innerHTML=history.length?history.map(x=>'<div class="row">✓ '+esc(x.key)+' → '+esc(x.label)+' <span style="float:right">'+esc(x.time)+'</span></div>').join(''):'No trigger runs yet.'}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toggleDev(v){dev.classList.toggle('open',v);if(v){$('triggerCount').textContent=Object.keys(exact).length+Object.keys(results).length;$('mediaCount').textContent=new Set([...Object.values(exact),...Object.values(results)].map(x=>x.video).filter(Boolean)).size;renderHistory()}}
function testTrigger(k){if(exact[k])playTrigger(exact[k],k);else if(results[k])playTrigger(results[k],'result '+k)}
$('memoryBtn').onclick=()=>{memory=lastAnswer??Number(expression)||0;render();say('Memory stored')};$('historyBtn').onclick=()=>toggleDev(true);$('scientificBtn').onclick=toggleScientific;$('closeDev').onclick=()=>toggleDev(false);document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>press(b.dataset.k));document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>scientific(b.dataset.s));document.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>testTrigger(b.dataset.test));document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='d'){toggleDev(!dev.classList.contains('open'));return}if(/^[0-9]$/.test(e.key)||['+','-','*','/','(',')','.'].includes(e.key))press(e.key);else if(e.key==='Enter'||e.key==='=')press('=');else if(e.key==='Backspace')press('DEL');else if(e.key==='Escape'){if(dev.classList.contains('open'))toggleDev(false);else if(videoScreen.classList.contains('show'))finish();else press('C')}});render();renderHistory();
</script></body></html>
