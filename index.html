<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beer Calculator</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b0f;color:#fff;font-family:Arial,sans-serif}.calculator{width:min(360px,92vw);padding:20px;background:#17171d;border:1px solid #2b2b35;border-radius:24px;position:relative;overflow:hidden;box-shadow:0 25px 70px #0008}.display{width:100%;height:80px;margin-bottom:12px;border:0;border-radius:14px;background:#0c0c10;color:#fff;font-size:34px;text-align:right;padding:12px}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}button{height:60px;border:0;border-radius:14px;background:#292931;color:#fff;font-size:20px;cursor:pointer}button:active{transform:scale(.96)}.op{background:#3a3a45}.eq{background:#2563eb}.clear{background:#b91c1c}.hint{text-align:center;color:#777;font-size:11px;margin-top:10px}.lyrics{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:rgba(12,12,16,.98);text-align:center;font-size:19px;line-height:1.55;opacity:0;visibility:hidden;transition:opacity 1.5s ease;z-index:10}.lyrics.show{opacity:1;visibility:visible}.lyricsText{white-space:pre-line;max-width:310px}
</style>
</head>
<body>
<main class="calculator">
<input id="display" class="display" readonly>
<div class="buttons">
<button class="clear" onclick="clearDisplay()">C</button><button onclick="del()">DEL</button><button onclick="add('(')">(</button><button class="op" onclick="add('/')">÷</button>
<button onclick="add('7')">7</button><button onclick="add('8')">8</button><button onclick="add('9')">9</button><button class="op" onclick="add('*')">×</button>
<button onclick="add('4')">4</button><button onclick="add('5')">5</button><button onclick="add('6')">6</button><button class="op" onclick="add('-')">−</button>
<button onclick="add('1')">1</button><button onclick="add('2')">2</button><button onclick="add('3')">3</button><button class="op" onclick="add('+')">+</button>
<button onclick="add('0')">0</button><button onclick="add('.')">.</button><button class="eq" onclick="calculate()">=</button><button onclick="add(')')">)</button>
</div><div class="hint">Try 1 + 1</div>
<div id="lyrics" class="lyrics"><div id="lyricsText" class="lyricsText"></div></div>
</main>
<audio id="music" src="./Beer.mp3" preload="auto"></audio>
