<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Calculator</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#fff;font-family:Arial,sans-serif}.calculator{width:min(360px,92vw);padding:20px;background:#222;border-radius:20px;transition:opacity 1s ease}.display{width:100%;height:80px;background:#0b0b0d;border:0;border-radius:12px;color:#fff;font-size:34px;text-align:right;padding:12px;margin-bottom:12px}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}button{height:62px;border:0;border-radius:13px;background:#444;color:#fff;font-size:20px;cursor:pointer;touch-action:manipulation}.operator{background:#555}.equals{background:#1677ff}.clear{background:#c22}button:active{transform:scale(.96)}.calculator.hide{opacity:0;pointer-events:none}.video-screen{position:fixed;inset:0;background:#000;display:grid;place-items:center;opacity:0;visibility:hidden;pointer-events:none;transition:opacity 1s ease}.video-screen.show{opacity:1;visibility:visible}.video-screen video{width:100%;height:100%;object-fit:contain}</style></head><body><div id="calculator" class="calculator"><input id="display" class="display" value="0" readonly><div class="buttons"><button class="clear" onclick="press('C')">C</button><button onclick="press('DEL')">DEL</button><button onclick="press('(')">(</button><button class="operator" onclick="press('/')">÷</button><button onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button><button class="operator" onclick="press('*')">×</button><button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button><button class="operator" onclick="press('-')">−</button><button onclick="press('1')">1</button><button onclick="press('2')">2</button><button onclick="press('3')">3</button><button class="operator" onclick="press('+')">+</button><button onclick="press('0')">0</button><button onclick="press('.')">.</button><button class="equals" onclick="press('=')">=</button><button onclick="press(')')">)</button></div></div><div id="videoScreen" class="video-screen"><video id="video" src="./Beer.mp4" playsinline preload="auto" muted></video></div><audio id="audio" src="./Beer.mp3" preload="auto"></audio><script>var expression='',display=document.getElementById('display'),calculator=document.getElementById('calculator'),videoScreen=document.getElementById('videoScreen'),video=document.getElementById('video'),audio=document.getElementById('audio');function render(){display.value=expression||'0'}function press(k){if(k==='C'){expression='';render();return}if(k==='DEL'){expression=expression.slice(0,-1);render();return}if(k==='='){solve();return}expression+=k;render()}function solve(){try{var s=expression.replace(/\s/g,'');if(!s||!/^[0-9+\-*/().]+$/.test(s))throw 0;var nums=[],ops=[],i=0;function p(o){return o==='+'||o==='-'?1:2}function a(){var b=nums.pop(),x=nums.pop(),o=ops.pop();if(x===undefined||b===undefined)throw 0;if(o==='+')nums.push(x+b);else if(o==='-')nums.push(x-b);else if(o==='*')nums.push(x*b);else{if(b===0)throw 0;nums.push(x/b)}}while(i<s.length){var c=s[i];if(/[0-9.]/.test(c)){var st=i;while(i<s.length&&/[0-9.]/.test(s[i]))i++;var n=Number(s.slice(st,i));if(!Number.isFinite(n))throw 0;nums.push(n);continue}if(c==='('){ops.push(c);i++;continue}if(c===')'){while(ops.length&&ops[ops.length-1]!=='(')a();if(ops.pop()!=='(')throw 0;i++;continue}if('+-*/'.includes(c)){if(c==='-'&&(i===0||'(+\-*/'.includes(s[i-1])))nums.push(0);while(ops.length&&ops[ops.length-1]!=='('&&p(ops[ops.length-1])>=p(c))a();ops.push(c);i++;continue}throw 0}while(ops.length){if(ops[ops.length-1]==='(')throw 0;a()}if(nums.length!==1||!Number.isFinite(nums[0]))throw 0;var special=s==='1+1';expression=String(nums[0]);render();if(special)playMedia()}catch(e){expression='';display.value='Error'}}function playMedia(){audio.pause();video.pause();audio.currentTime=0;video.currentTime=0;var audioPromise=audio.play();if(audioPromise&&audioPromise.catch)audioPromise.catch(function(){});calculator.classList.add('hide');setTimeout(function(){videoScreen.classList.add('show');var videoPromise=video.play();if(videoPromise&&videoPromise.catch)videoPromise.catch(function(){})},1000)}function sync(){if(!video.paused&&!audio.paused&&Math.abs(video.currentTime-audio.currentTime)>0.08)audio.currentTime=video.currentTime}video.addEventListener('timeupdate',sync);video.addEventListener('ended',function(){audio.pause();audio.currentTime=0;videoScreen.classList.remove('show');setTimeout(function(){calculator.classList.remove('hide')},1000)});audio.addEventListener('ended',function(){if(!video.ended){video.pause();video.currentTime=0;videoScreen.classList.remove('show');setTimeout(function(){calculator.classList.remove('hide')},1000)}});document.addEventListener('keydown',function(e){if(/^[0-9]$/.test(e.key)||['+','-','*','/','(',')','.'].includes(e.key))press(e.key);else if(e.key==='Enter'||e.key==='=')press('=');else if(e.key==='Backspace')press('DEL');else if(e.key==='Escape')press('C')});</script></body></html>
