<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Beer Calculator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;display:grid;place-items:center;background:#0b0b0f;color:#fff;font-family:Arial,sans-serif}.calculator{width:min(360px,92vw);padding:20px;border:1px solid #2b2b35;border-radius:24px;background:#17171d;box-shadow:0 25px 70px #0008;position:relative;overflow:hidden}.display{width:100%;height:88px;border:0;border-radius:16px;background:#0c0c10;color:#fff;padding:16px;text-align:right;font-size:36px;outline:0;margin-bottom:14px}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}button{height:62px;border:0;border-radius:15px;background:#292931;color:#fff;font-size:20px;cursor:pointer;transition:.12s}button:hover{filter:brightness(1.15)}button:active{transform:scale(.95)}.op{background:#3a3a45}.eq{background:#2563eb}.clear{background:#b91c1c}.hint{font-size:11px;color:#777;text-align:center;margin-top:12px}.lyrics{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:25px;background:rgba(12,12,16,.97);font-size:20px;line-height:1.5;opacity:0;visibility:hidden;pointer-events:none;transition:opacity:1.5s ease}.lyrics.show{opacity:1;visibility:visible}.lyrics-text{white-space:pre-line;max-width:300px}</style>
</head>
<body>
<div class="calculator">
<input id="display" class="display" readonly aria-label="Calculator display">
<div class="buttons">
<button class="clear" onclick="clearDisplay()">C</button><button onclick="del()">DEL</button><button onclick="add('(')">(</button><button class="op" onclick="add('/')">÷</button>
<button onclick="add('7')">7</button><button onclick="add('8')">8</button><button onclick="add('9')">9</button><button class="op" onclick="add('*')">×</button>
<button onclick="add('4')">4</button><button onclick="add('5')">5</button><button onclick="add('6')">6</button><button class="op" onclick="add('-')">−</button>
<button onclick="add('1')">1</button><button onclick="add('2')">2</button><button onclick="add('3')">3</button><button class="op" onclick="add('+')">+</button>
<button onclick="add('0')">0</button><button onclick="add('.')">.</button><button class="eq" onclick="calculate()">=</button><button onclick="add(')')">)</button>
</div><div class="hint">Try 1 + 1</div>
<div id="lyrics" class="lyrics"><div class="lyrics-text">Nais kong magpakalasing
Dahil wala ka na

Nakatingin sa salamin
At nag-iisa

Nakatanim pa rin
