<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beer Calculator</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#fff;font-family:Arial,sans-serif}.calc{width:min(340px,92vw);padding:18px;background:#222;border-radius:20px}.display{width:100%;height:80px;background:#0b0b0d;border:0;border-radius:12px;margin-bottom:12px;color:#fff;font-size:32px;text-align:right;padding:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}button{height:58px;border:0;border-radius:11px;background:#444;color:#fff;font-size:19px;cursor:pointer;touch-action:manipulation}.eq{background:#1677ff}.clear{background:#c22}button:active{transform:scale(.96)}
.lyrics-screen{position:fixed;inset:0;background:#111;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;pointer-events:none;transition:opacity 1.2s ease}.lyrics-screen.show{opacity:1;visibility:visible}.lyrics-box{width:min(700px,90vw);height:min(500px,75vh);padding:35px 25px;overflow:hidden;text-align:center;background:#181818;border:1px solid #333;border-radius:24px}.line{font-size:18px;line-height:1.45;margin:10px 0;color:#555;transition:all .6s}.line.current{font-size:27px;font-weight:bold;color:#fff}.line.next{color:#777}
</style>
</head>
<body>
<div class="calc">
<input id="display" class="display" value="0" readonly>
<div class="grid">
<button class="clear" onclick="press('C')">C</button><button onclick="press('DEL')">DEL</button><button onclick="press('(')">(</button><button onclick="press('/')">÷</button>
<button onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button><button onclick="press('*')">×</button>
<button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button><button onclick="press('-')">−</button>
<button onclick="press('1')">1</button><button onclick="press('2')">2</button><button onclick="press('3')">3</button><button onclick="press('+')">+</button>
<button onclick="press('0')">0</button><button onclick="press('.')">.</button><button class="eq" onclick="press('=')">=</button><button onclick="press(')')">)</button>
</div></div>
<div id="lyricsScreen" class="lyrics-screen"><div id="lyricsBox" class="lyrics-box"></div></div>
<audio id="audio" src="./Beer.mp3" preload="metadata"></audio>
