<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Calculator</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#fff;font-family:Arial,sans-serif}.calculator{width:min(360px,92vw);padding:20px;background:#222;border-radius:20px;transition:opacity 1s ease}.display{width:100%;height:80px;background:#0b0b0d;border:0;border-radius:12px;color:#fff;font-size:34px;text-align:right;padding:12px;margin-bottom:12px}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}button{height:62px;border:0;border-radius:13px;background:#444;color:#fff;font-size:20px;cursor:pointer;touch-action:manipulation}.operator{background:#555}.equals{background:#1677ff}.clear{background:#c22}button:active{transform:scale(.96)}.calculator.hide{opacity:0;pointer-events:none}.video-screen{position:fixed;inset:0;background:#000;display:grid;place-items:center;opacity:0;visibility:hidden;pointer-events:none;transition:opacity 1s ease}.video-screen.show{opacity:1;visibility:visible}.video-screen video{width:100%;height:100%;object-fit:contain}</style></head><body><div id="calculator" class="calculator"><input id="display" class="display" value="0" readonly><div class="buttons"><button class="clear" onclick="press('C')">C</button><button onclick="press('DEL')">DEL</button><button onclick="press('(')">(</button><button class="operator" onclick="press('/')">÷</button><button onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button><button class="operator" onclick="press('*')">×</button><button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button><button class="operator" onclick="press('-')">−</button><button onclick="press('1')">1</button><button onclick="press('2')">2</button><button onclick="press('3')">3</button><button class="operator" onclick="press('+')">+</button><button onclick="press('0')">0</button><button onclick="press('.')">.</button><button class="equals" onclick="press('=')">=</button><button onclick="press(')')">)</button></div></div><div id="videoScreen" class="video-screen"><video id="video" playsinline preload="auto"></video></div><audio id="audio" preload="auto"></audio><script>/* ========================= TRIGGER SYSTEM =========================
   Add future easter eggs here. No calculator logic needs to change.
   key: exact expression, video: file in repository, audio: optional,
   muted: whether the video's own audio should be muted.
=================================================================== */
const TRIGGERS={
  '1+1':{video:'Beer.mp4',audio:'Beer.mp3',muted:true,syncAudio:true},
  '2+2':{video:'jv.mp4',muted:false,syncAudio:false},
  '123':{video:'snaptik_7624995020080286990_v3.mp4',muted:false,syncAudio:false}
};

let expression='';
const display=document.getElementById('display');
const calculator=document.getElementById('calculator');
const videoScreen=document.getElementById('videoScreen');
const video=document.getElementById('video');
const audio=document.getElementById('audio');
let activeTrigger=null;

function render(){display.value=expression||'0'}

function press(key){
  if(key==='C'){stopMedia();expression='';render();return}
  if(key==='DEL'){expression=expression.slice(0,-1);render();return}
  if(key==='='){solve();return}
  expression+=key;
  render();
  checkTrigger(expression);
}

function checkTrigger(value){
  const trigger=TRIGGERS[value];
  if(trigger) playTrigger(trigger);
}

function solve(){
  try{
    const s=expression.replace(/\s/g,'');
    if(!s||!/^[0-9+\-*/().]+$/.test(s))throw 0;
    const nums=[],ops=[];let i=0;
    function precedence(o){return o==='+'||o==='-'?1:2}
    function apply(){
      const b=nums.pop(),a=nums.pop(),o=ops.pop();
      if(a===undefined||b===undefined)throw 0;
      if(o==='+')nums.push(a+b);
      else if(o==='-')nums.push(a-b);
      else if(o==='*')nums.push(a*b);
      else{if(b===0)throw 0;nums.push(a/b)}
    }
    while(i<s.length){
      const c=s[i];
      if(/[0-9.]/.test(c)){
        const start=i;
        while(i<s.length&&/[0-9.]/.test(s[i]))i++;
        const n=Number(s.slice(start,i));
        if(!Number.isFinite(n))throw 0;
        nums.push(n);continue
      }
      if(c==='('){ops.push(c);i++;continue}
      if(c===')'){
        while(ops.length&&ops[ops.length-1]!=='(')apply();
        if(ops.pop()!=='(')throw 0;i++;continue
      }
      if('+-*/'.includes(c)){
        if(c==='-'&&(i===0||'(+\-*/'.includes(s[i-1])))nums.push(0);
        while(ops.length&&ops[ops.length-1]!=='('&&precedence(ops[ops.length-1])>=precedence(c))apply();
        ops.push(c);i++;continue
      }
      throw 0
    }
    while(ops.length){if(ops[ops.length-1]==='(')throw 0;apply()}
    if(nums.length!==1||!Number.isFinite(nums[0]))throw 0;
    expression=String(nums[0]);render();
    checkTrigger(s);
  }catch(e){expression='';display.value='Error'}
}

function playTrigger(trigger){
  stopMedia();
  activeTrigger=trigger;
  video.src='./'+trigger.video;
  video.muted=!!trigger.muted;
  video.currentTime=0;
  calculator.classList.add('hide');

  if(trigger.audio){
    audio.src='./'+trigger.audio;
    audio.currentTime=0;
    audio.load();
    const ap=audio.play();
    if(ap&&ap.catch)ap.catch(()=>{});
  }else{
    audio.removeAttribute('src');
    audio.load();
  }

  setTimeout(()=>{
    if(activeTrigger!==trigger)return;
    videoScreen.classList.add('show');
    video.currentTime=0;
    const vp=video.play();
    if(vp&&vp.catch)vp.catch(()=>{});
  },700);
}

function stopMedia(){
  activeTrigger=null;
  audio.pause();
  video.pause();
  audio.currentTime=0;
  video.currentTime=0;
  videoScreen.classList.remove('show');
}

function finishMedia(){
  stopMedia();
  setTimeout(()=>calculator.classList.remove('hide'),700);
}

/* Beer: MP3 is the master clock. Only correct the muted lyric video
   when drift becomes noticeable. This avoids audio stuttering. */
audio.addEventListener('timeupdate',()=>{
  if(activeTrigger&&activeTrigger.syncAudio&&!audio.paused&&!video.paused){
    const drift=video.currentTime-audio.currentTime;
    if(Math.abs(drift)>0.25)video.currentTime=audio.currentTime;
  }
});

video.addEventListener('ended',()=>finishMedia());
audio.addEventListener('ended',()=>{
  if(activeTrigger&&activeTrigger.syncAudio&&!video.ended)finishMedia();
});

document.addEventListener('keydown',e=>{
  if(/^[0-9]$/.test(e.key)||['+','-','*','/','(',')','.'].includes(e.key))press(e.key);
  else if(e.key==='Enter'||e.key==='=')press('=');
  else if(e.key==='Backspace')press('DEL');
  else if(e.key==='Escape')press('C');
});
</script></body></html>
